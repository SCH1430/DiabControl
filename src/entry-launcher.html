    <div
      id="entryLauncherModal"

      aria-modal="true"
      aria-labelledby="entryLauncherTitle"
      aria-describedby="entryLauncherDescription"

      <div class="modal-content">
        <div class="modal-head">
          <div>
            <p class="eyebrow">ДОБАВИТЬ В ДНЕВНИК</p>

          <button type="button" class="icon-btn close" data-close aria-label="Закрыть выбор записи">×</button>

          <button type="button" data-launch-entry="sugar" class="entry-launcher-option">
            <span class="entry-launcher-symbol" aria-hidden="true"></span>
            <span><strong>Глюкоза</strong><small>Результат измерения</small></span>
            <span class="entry-launcher-arrow" aria-hidden="true">→</span>
          </button>
          <button type="button" data-launch-entry="food" class="entry-launcher-option">
            <span class="entry-launcher-symbol" aria-hidden="true"></span>
            <span><strong>Питание</strong><small>Блюдо и порция</small></span>
            <span class="entry-launcher-arrow" aria-hidden="true">→</span>
          </button>
          <button type="button" data-launch-entry="insulin" class="entry-launcher-option">
            <span class="entry-launcher-symbol" aria-hidden="true"></span>
            <span><strong>Инсулин</strong><small>Уже введённая доза</small></span>
            <span class="entry-launcher-arrow" aria-hidden="true">→</span>
          </button>
          <button type="button" data-launch-entry="wellbeing" class="entry-launcher-option">
            <span class="entry-launcher-symbol" aria-hidden="true"></span>
            <span><strong>Заметка</strong><small>Самочувствие и активность</small></span>
            <span class="entry-launcher-arrow" aria-hidden="true">→</span>
          </button>
        </div>
      </div>
    </div>
